# ==============================================================================
# CodeMentor AI Spring Boot Application Configuration
# ==============================================================================

spring.application.name=codementor-api
server.port=8080

# PostgreSQL / Supabase DataSource Configuration with environment variables
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codementor_db}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings - Non-blocking startup when DB is offline
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# AI Service Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.8-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# CORS Configuration - Allows Vite frontend on localhost:5173
app.cors.allowed-origins=${APP_URL:http://localhost:5173}

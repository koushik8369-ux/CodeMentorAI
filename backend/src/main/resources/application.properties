# ==============================================================================
# CodeMentor AI Spring Boot Application Configuration (Stateless / Database-Free)
# ==============================================================================

spring.application.name=codementor-api
server.port=${PORT:8080}

# AI Service Configuration (Isolated to Spring Boot Backend)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

# Demo Mode & Stateless Token Configuration
jwt.secret=${JWT_SECRET:CodeMentorAISecretKeyForJwtTokenGeneration2026Secure256BitsMinimum}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Production CORS Configuration (Supports comma-separated deployed frontend URLs and common cloud env vars)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:${FRONTEND_URL:${APP_URL:https://code-mentor-ai-hkrx.vercel.app,http://localhost:5173,http://localhost:3000}}}}

# Actuator Health Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenRouter AI Programming Mentor Configuration (Isolated to Spring Boot Backend)
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.model=${OPENROUTER_MODEL:tencent/hy4}
openrouter.fallback.model=${OPENROUTER_FALLBACK_MODEL:deepseek/deepseek-chat}
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}


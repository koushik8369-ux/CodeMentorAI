# ==============================================================================
# CodeMentor AI Spring Boot Application Configuration (Stateless / Database-Free)
# ==============================================================================

spring.application.name=codementor-api
server.port=8080

# AI Service Configuration (Isolated to Spring Boot Backend)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.8-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# Demo Mode & Stateless Token Configuration
jwt.secret=${JWT_SECRET:CodeMentorAISecretKeyForJwtTokenGeneration2026Secure256BitsMinimum}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
app.cors.allowed-origins=${APP_URL:http://localhost:5173}

# Actuator Health Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
